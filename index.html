<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>دروازه ورود به کهکشان عشق ✨</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800;900&display=swap');

    :root {
      --gold-primary: #d4af37;
      --gold-glow: #ffe28a;
      --rose-neon: #ff2a70;
      --space-dark: #07030c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--space-dark);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* بوم ذرات نوری */
    #particle-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    /* هاله‌های نوری پس‌زمینه */
    .nebula-glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      z-index: 2;
      opacity: 0.45;
      animation: floatNebula 10s infinite alternate ease-in-out;
      pointer-events: none;
    }

    .nebula-1 {
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, #ff2a70, transparent 70%);
      top: -10%;
      left: -5%;
    }

    .nebula-2 {
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, #d4af37, transparent 70%);
      bottom: -15%;
      right: -10%;
      animation-delay: -5s;
    }

    @keyframes floatNebula {
      0% { transform: scale(1) translate(0, 0); }
      100% { transform: scale(1.2) translate(40px, 30px); }
    }

    /* کارت ورود شیشه‌ای */
    .lock-card-wrap {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 430px;
      padding: 2px;
      border-radius: 36px;
      background: linear-gradient(135deg, rgba(255, 226, 138, 0.4), rgba(255, 42, 112, 0.2), rgba(255, 255, 255, 0.05));
      box-shadow: 0 30px 100px rgba(0, 0, 0, 0.9), 0 0 50px rgba(255, 42, 112, 0.25);
      animation: cardEntrance 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardEntrance {
      from {
        opacity: 0;
        transform: translateY(50px) scale(0.92);
        filter: blur(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    .lock-card {
      background: rgba(15, 7, 26, 0.72);
      backdrop-filter: blur(35px);
      -webkit-backdrop-filter: blur(35px);
      border-radius: 34px;
      padding: 42px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* نماد قفل طلایی درخشان */
    .lock-icon-container {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ff2a70, #42031a);
      border: 2px solid rgba(255, 226, 138, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.3rem;
      box-shadow: 0 0 40px rgba(255, 42, 112, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.5);
      margin-bottom: 24px;
      animation: pulseGlow 2.5s infinite ease-in-out;
      transition: all 0.5s ease;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); box-shadow: 0 0 35px rgba(255, 42, 112, 0.5); }
      50% { transform: scale(1.08); box-shadow: 0 0 60px rgba(255, 226, 138, 0.85); }
    }

    .card-title {
      font-size: 1.55rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff, var(--gold-glow), #ffd1e3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .card-subtitle {
      font-size: 0.95rem;
      color: #baa3cf;
      line-height: 1.8;
      font-weight: 300;
      margin-bottom: 28px;
    }

    /* کادر ورودی رمز عبور */
    .input-wrapper {
      width: 100%;
      position: relative;
      margin-bottom: 12px;
    }

    .pass-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1.5px solid rgba(255, 255, 255, 0.16);
      border-radius: 50px;
      padding: 15px 48px 15px 20px;
      font-size: 1.25rem;
      color: #fff;
      text-align: center;
      letter-spacing: 4px;
      outline: none;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .pass-input::placeholder {
      letter-spacing: 0;
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.3);
      font-weight: 300;
    }

    .pass-input:focus {
      background: rgba(255, 255, 255, 0.09);
      border-color: var(--gold-glow);
      box-shadow: 0 0 25px rgba(255, 226, 138, 0.35);
    }

    /* دکمه چشم برای دیدن رمز */
    .toggle-pass-btn {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.5);
      cursor: pointer;
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }

    .toggle-pass-btn:hover {
      color: var(--gold-glow);
    }

    /* پیام خطا یا موفقیت */
    .status-msg {
      font-size: 0.88rem;
      min-height: 22px;
      margin-bottom: 20px;
      font-weight: 400;
      transition: all 0.3s ease;
      opacity: 0;
      transform: translateY(-5px);
    }

    .status-msg.show {
      opacity: 1;
      transform: translateY(0);
    }

    .status-msg.error {
      color: #ff5277;
      text-shadow: 0 0 10px rgba(255, 82, 119, 0.6);
    }

    .status-msg.success {
      color: #5effa4;
      text-shadow: 0 0 10px rgba(94, 255, 164, 0.6);
    }

    /* دکمه ورود باشکوه */
    .btn-unlock {
      width: 100%;
      padding: 15px;
      border-radius: 50px;
      border: none;
      background: linear-gradient(135deg, var(--rose-neon), #8c0c3e);
      color: #fff;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 12px 35px rgba(255, 42, 112, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.3s ease;
    }

    .btn-unlock:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 16px 45px rgba(255, 42, 112, 0.65);
    }

    .btn-unlock:active {
      transform: scale(0.98);
    }

    /* لرزش کارت در صورت خطا */
    .shake-anim {
      animation: shakeCard 0.45s ease-in-out;
    }

    @keyframes shakeCard {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-14px); }
      40% { transform: translateX(12px); }
      60% { transform: translateX(-8px); }
      80% { transform: translateX(6px); }
    }

    /* انیمیشن محو شدن برای ورود نهایی */
    .unlock-transition {
      animation: zoomFadeOut 0.9s cubic-bezier(0.7, 0, 0.84, 0) forwards;
    }

    @keyframes zoomFadeOut {
      to {
        opacity: 0;
        transform: scale(1.25);
        filter: blur(20px);
      }
    }
  </style>
</head>
<body>

  <!-- هاله‌های نوری شناور -->
  <div class="nebula-glow nebula-1"></div>
  <div class="nebula-glow nebula-2"></div>

  <!-- کَنوَس ستاره‌های متحرک -->
  <canvas id="particle-canvas"></canvas>

  <!-- کارت شیشه‌ای قفل -->
  <div class="lock-card-wrap" id="card-wrap">
    <div class="lock-card">
      <div class="lock-icon-container" id="lock-icon">🔒</div>
      
      <h1 class="card-title">دروازه یک راز عاشقانه ✨</h1>
      <p class="card-subtitle">کلید ورود به کهکشان را وارد کن تا پرده‌ها کنار بروند...</p>

      <div class="input-wrapper">
        <input 
          type="password" 
          id="passcode" 
          class="pass-input" 
          placeholder="کلید واژهٔ دل..." 
          autocomplete="off"
          autofocus
        />
        <button type="button" class="toggle-pass-btn" onclick="togglePassVisibility()" title="نمایش رمز">
          <span id="eye-icon">👁️</span>
        </button>
      </div>

      <div class="status-msg" id="status-msg"></div>

      <button class="btn-unlock" onclick="verifyPassword()">
        <span>گشودن قفل کهکشان</span>
        <span>✨</span>
      </button>
    </div>
  </div>

  <script>
    const CORRECT_PASS = "eshg";
    const TARGET_URL = "https://mohadesehreza.github.io/dokhtar/";

    const passInput = document.getElementById('passcode');
    const statusMsg = document.getElementById('status-msg');
    const cardWrap = document.getElementById('card-wrap');
    const lockIcon = document.getElementById('lock-icon');

    // تایید با زدن Enter
    passInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        verifyPassword();
      }
    });

    // بررسی رمز عبور
    function verifyPassword() {
      const entered = passInput.value.trim().toLowerCase();

      if (!entered) {
        showStatus('لطفاً رمز عبور را وارد کنید ✨', 'error');
        shakeCard();
        return;
      }

      if (entered === CORRECT_PASS) {
        // حالت ورود موفق
        showStatus('رمز گشوده شد... در حال انتقال به مدار عشق 💖', 'success');
        lockIcon.innerText = '🔓';
        lockIcon.style.background = 'radial-gradient(circle, #5effa4, #045228)';
        lockIcon.style.boxShadow = '0 0 60px rgba(94, 255, 164, 0.8)';
        passInput.disabled = true;

        // ترنزیشن محو شدن سینمایی و هدایت
        setTimeout(() => {
          cardWrap.classList.add('unlock-transition');
          setTimeout(() => {
            window.location.href = TARGET_URL;
          }, 800);
        }, 500);

      } else {
        // حالت رمز اشتباه
        showStatus('رمز اشتباه است؛ دوباره امتحان کن 🌸', 'error');
        shakeCard();
        passInput.value = '';
        passInput.focus();
      }
    }

    function showStatus(text, type) {
      statusMsg.innerText = text;
      statusMsg.className = `status-msg show ${type}`;
    }

    function shakeCard() {
      cardWrap.classList.remove('shake-anim');
      void cardWrap.offsetWidth; // ریست ترنزیشن
      cardWrap.classList.add('shake-anim');
    }

    function togglePassVisibility() {
      const eye = document.getElementById('eye-icon');
      if (passInput.type === 'password') {
        passInput.type = 'text';
        eye.innerText = '🔒';
      } else {
        passInput.type = 'password';
        eye.innerText = '👁️';
      }
    }

    /* ================= انیمیشن پس‌زمینه ستاره‌ای ================= */
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2.2 + 0.5;
        this.speedY = -(Math.random() * 0.4 + 0.1);
        this.speedX = (Math.random() - 0.5) * 0.3;
        this.opacity = Math.random() * 0.8 + 0.2;
        this.color = Math.random() > 0.4 ? '255, 226, 138' : '255, 42, 112';
      }
      update() {
        this.y += this.speedY;
        this.x += this.speedX;
        if (this.y < -10 || this.x < -10 || this.x > canvas.width + 10) {
          this.reset();
          this.y = canvas.height + 10;
        }
      }
      draw() {
        ctx.fillStyle = `rgba(${this.color}, ${this.opacity})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let i = 0; i < 90; i++) {
      particles.push(new Particle());
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();
  </script>
</body>
</html>
